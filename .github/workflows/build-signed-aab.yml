# -----------------------------------------------------------------
# Project Name: Signed AAB Builder
# Workflow File: .github/workflows/build-signed-aab.yml
# This workflow is designed to be triggered by the Telegram Bot.
# -----------------------------------------------------------------

name: Build Signed AAB from APK (API Trigger)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct Download URL of the APK file'
        required: true
      keystore_base64:
        description: 'Your Keystore file ENCODED in Base64 format'
        required: true
      keystore_password:
        description: 'Your Keystore Password'
        required: true
      key_alias:
        description: 'Your Key Alias Name'
        required: true
      key_password:
        description: 'Your Key Alias Password'
        required: true

jobs:
  build-aab:
    name: Build and Sign AAB
    runs-on: ubuntu-latest
    
    steps:
      # ধাপ ১: প্রয়োজনীয় টুলস (apktool ও bundletool) ইনস্টল করা
      - name: Install Required Tools
        run: |
          echo "Installing required tools..."
          sudo apt-get update && sudo apt-get install -y wget zip
          
          # apktool ইনস্টল করা
          wget https://bit.ly/apktool-install-linux -O apktool-install-linux && chmod +x apktool-install-linux
          sudo mv apktool-install-linux /usr/local/bin/
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool && chmod +x apktool
          sudo mv apktool /usr/local/bin/
          
          # bundletool ইনস্টল করা
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar
          echo "Tools installed successfully."

      # ধাপ ২: APK ফাইল ডাউনলোড এবং Base64 থেকে Keystore ফাইল তৈরি করা
      - name: Download APK and Decode Keystore
        run: |
          echo "Downloading APK from URL..."
          wget -O original.apk "${{ github.event.inputs.apk_url }}"
          
          echo "Decoding Keystore from Base64 string..."
          echo "${{ github.event.inputs.keystore_base64 }}" | base64 --decode > my-release-key.jks

      # ধাপ ৩: APK ফাইল ডিকম্পাইল করা
      - name: Decompile APK
        run: |
          echo "Decompiling APK using apktool..."
          apktool d original.apk -o decompiled_folder

      # ধাপ ৪: AAB তৈরি করা এবং সাইন করা
      - name: Build and Sign the AAB file
        run: |
          echo "Creating a zip from decompiled folder..."
          (cd decompiled_folder && zip -qr ../base.zip .)
          
          echo "Building unsigned AAB from the zip..."
          java -jar bundletool.jar build-bundle --modules=base.zip --output=unsigned.aab
          
          echo "Signing the AAB with the provided Keystore..."
          java -jar bundletool.jar sign-bundle \
            --input=unsigned.aab \
            --output=signed-release.aab \
            --ks=my-release-key.jks \
            --ks-pass=pass:${{ github.event.inputs.keystore_password }} \
            --ks-key-alias=${{ github.event.inputs.key_alias }} \
            --key-pass=pass:${{ github.event.inputs.key_password }}
          echo "AAB signing complete."

      # ধাপ ৫: তৈরি হওয়া ফাইনাল AAB ফাইলটি আপলোড করা
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab-file
          path: signed-release.aab
          retention-days: 5
