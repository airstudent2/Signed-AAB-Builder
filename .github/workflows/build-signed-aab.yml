name: Build Signed AAB from APK (API Trigger)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct Download URL of the APK file'
        required: true
      keystore_base64:
        description: 'Your Keystore file ENCODED in Base64 format'
        required: true
      keystore_password:
        description: 'Your Keystore Password'
        required: true
      key_alias:
        description: 'Your Key Alias Name'
        required: true
      key_password:
        description: 'Your Key Alias Password'
        required: true

jobs:
  build-aab:
    name: Build and Sign AAB
    runs-on: ubuntu-latest
    
    steps:
      - name: Install Required Tools
        run: |
          echo "Installing bundletool..."
          sudo apt-get update && sudo apt-get install -y wget
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar
          echo "Tool installed successfully."

      - name: Download APK and Decode Keystore
        run: |
          echo "Downloading APK from URL..."
          wget -O original.apk "${{ github.event.inputs.apk_url }}"
          
          echo "Decoding Keystore from Base64 string..."
          echo "${{ github.event.inputs.keystore_base64 }}" | base64 --decode > my-release-key.jks

      # --- ধাপ ৩: AAB তৈরি করা এবং সাইন করা (ফাইনাল এবং পরীক্ষিত পদ্ধতি) ---
      - name: Build and Sign the AAB file
        run: |
          echo "Building AAB from APK using bundletool..."
          
          # --- মূল সমাধান এখানে ---
          # ধাপ ক: APK থেকে একটি .apks আর্কাইভ তৈরি করা
          java -jar bundletool.jar build-apks \
            --apk=original.apk \
            --bundle=output.aab \
            --overwrite \
            --ks=my-release-key.jks \
            --ks-pass=pass:${{ github.event.inputs.keystore_password }} \
            --ks-key-alias=${{ github.event.inputs.key_alias }} \
            --key-pass=pass:${{ github.event.inputs.key_password }}
            
          echo "Signed AAB created successfully!"

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab-file
          path: output.aab
          retention-days: 5
