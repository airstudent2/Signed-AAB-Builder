name: Build Signed AAB (Easy Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct Download URL of the APK file'
        required: true
      keystore_password:
        description: 'Your Keystore Password'
        required: true
      key_alias:
        description: 'Your Key Alias Name'
        required: true
      key_password:
        description: 'Your Key Alias Password'
        required: true

jobs:
  build-aab:
    name: Build and Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Files
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y wget zip unzip

          # bundletool download
          wget -q https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

          # Android command line tools (aapt2 এর জন্য)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdtools_tmp
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv cmdtools_tmp/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/

          # build-tools install (aapt2 এখানে থাকে)
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$HOME/android-sdk \
            "build-tools;34.0.0" > /dev/null

          echo "AAPT2=$HOME/android-sdk/build-tools/34.0.0/aapt2" >> $GITHUB_ENV

      - name: Download APK
        run: |
          wget -O original.apk "${{ github.event.inputs.apk_url }}"

      - name: Build and Sign AAB
        run: |
          echo "=== ধাপ ১: APK resources proto format এ convert করা ==="
          $AAPT2 convert --output-format proto original.apk -o proto.apk

          echo "=== ধাপ ২: proto APK extract করা ==="
          mkdir -p apk_extracted
          unzip -q proto.apk -d apk_extracted

          echo "=== ধাপ ৩: bundletool module structure তৈরি করা ==="
          mkdir -p module/manifest
          mkdir -p module/dex
          mkdir -p module/res
          mkdir -p module/lib
          mkdir -p module/assets
          mkdir -p module/root

          # AndroidManifest.xml → manifest/ ফোল্ডারে
          cp apk_extracted/AndroidManifest.xml module/manifest/

          # resources.pb → module root এ
          [ -f apk_extracted/resources.pb ] && cp apk_extracted/resources.pb module/

          # DEX files → dex/ ফোল্ডারে
          find apk_extracted -maxdepth 1 -name "*.dex" | while read f; do
            cp "$f" module/dex/
          done

          # res/ → module এ (যদি থাকে)
          [ -d apk_extracted/res ] && cp -r apk_extracted/res module/

          # lib/ → module এ (native libraries, যদি থাকে)
          [ -d apk_extracted/lib ] && cp -r apk_extracted/lib module/

          # assets/ → module এ (যদি থাকে)
          [ -d apk_extracted/assets ] && cp -r apk_extracted/assets module/

          # অন্য root files (kotlin, META-INF/services) → root/ এ
          [ -d apk_extracted/kotlin ] && cp -r apk_extracted/kotlin module/root/
          [ -d apk_extracted/META-INF/services ] && \
            mkdir -p module/root/META-INF && \
            cp -r apk_extracted/META-INF/services module/root/META-INF/

          echo "=== ধাপ ৪: module ZIP তৈরি করা ==="
          cd module && zip -r ../module.zip . && cd ..

          echo "=== ধাপ ৫: unsigned AAB তৈরি করা ==="
          java -jar bundletool.jar build-bundle \
            --modules=module.zip \
            --output=unsigned.aab

          echo "=== ধাপ ৬: AAB সাইন করা ==="
          jarsigner \
            -keystore release-key.jks \
            -storepass ${{ github.event.inputs.keystore_password }} \
            -keypass ${{ github.event.inputs.key_password }} \
            -signedjar signed-release.aab \
            unsigned.aab \
            ${{ github.event.inputs.key_alias }}

          echo "✅ Done! signed-release.aab তৈরি হয়েছে।"

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab-file
          path: signed-release.aab
