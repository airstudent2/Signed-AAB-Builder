name: Build Signed AAB (Easy Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct Download URL of the APK file'
        required: true
      keystore_password:
        description: 'Your Keystore Password'
        required: true
      key_alias:
        description: 'Your Key Alias Name'
        required: true
      key_password:
        description: 'Your Key Alias Password'
        required: true

jobs:
  build-aab:
    name: Build and Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Files
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y wget zip unzip curl

          wget -q https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdtools_tmp
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv cmdtools_tmp/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/

          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$HOME/android-sdk \
            "build-tools;34.0.0" > /dev/null

          echo "AAPT2=$HOME/android-sdk/build-tools/34.0.0/aapt2" >> $GITHUB_ENV

      - name: Download APK
        run: |
          echo "=== APK Download শুরু ==="
          echo "URL: ${{ github.event.inputs.apk_url }}"

          # ✅ curl দিয়ে download - redirect follow করে, user-agent সেট করে
          curl -L \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5 \
            -o original.apk \
            "${{ github.event.inputs.apk_url }}"

          # ✅ Download হয়েছে কিনা verify করো
          echo "=== Downloaded file info ==="
          ls -lh original.apk
          file original.apk

          # ✅ Valid ZIP/APK কিনা চেক করো
          if ! unzip -t original.apk > /dev/null 2>&1; then
            echo "❌ Error: Downloaded file is not a valid APK/ZIP!"
            echo "=== File এর প্রথম কয়েক bytes ==="
            xxd original.apk | head -5
            echo ""
            echo "⚠️ সম্ভাব্য কারণ:"
            echo "   1. Link টা direct download link না"
            echo "   2. Google Drive হলে: https://drive.google.com/uc?export=download&id=FILE_ID ব্যবহার করুন"
            echo "   3. Link expire হয়ে গেছে"
            exit 1
          fi

          echo "✅ APK valid! Size: $(ls -lh original.apk | awk '{print $5}')"

      - name: Find Keystore File
        run: |
          if [ -f "$GITHUB_WORKSPACE/keystore.p12" ]; then
            echo "✅ keystore.p12 পাওয়া গেছে!"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.p12" >> $GITHUB_ENV
          elif [ -f "$GITHUB_WORKSPACE/release-key.jks" ]; then
            echo "✅ release-key.jks পাওয়া গেছে!"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-key.jks" >> $GITHUB_ENV
          elif find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.jks" | grep -q .; then
            JKS_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.jks" | head -1)
            echo "✅ JKS ফাইল পাওয়া গেছে: $JKS_FILE"
            echo "KEYSTORE_PATH=$JKS_FILE" >> $GITHUB_ENV
          elif find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.p12" | grep -q .; then
            P12_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.p12" | head -1)
            echo "✅ P12 ফাইল পাওয়া গেছে: $P12_FILE"
            echo "KEYSTORE_PATH=$P12_FILE" >> $GITHUB_ENV
          else
            echo "❌ কোনো Keystore ফাইল পাওয়া যায়নি!"
            exit 1
          fi

      - name: Build and Sign AAB
        run: |
          echo "=== ব্যবহার হচ্ছে: $KEYSTORE_PATH ==="

          echo "=== ধাপ ১: APK resources proto format এ convert করা ==="
          $AAPT2 convert --output-format proto original.apk -o proto.apk

          echo "=== ধাপ ২: proto APK extract করা ==="
          mkdir -p apk_extracted
          unzip -q proto.apk -d apk_extracted

          echo "=== ধাপ ৩: bundletool module structure তৈরি করা ==="
          mkdir -p module/manifest
          mkdir -p module/dex
          mkdir -p module/res
          mkdir -p module/lib
          mkdir -p module/assets
          mkdir -p module/root

          cp apk_extracted/AndroidManifest.xml module/manifest/

          [ -f apk_extracted/resources.pb ] && cp apk_extracted/resources.pb module/

          find apk_extracted -maxdepth 1 -name "*.dex" | while read f; do
            cp "$f" module/dex/
          done

          [ -d apk_extracted/res ]    && cp -r apk_extracted/res    module/
          [ -d apk_extracted/lib ]    && cp -r apk_extracted/lib    module/
          [ -d apk_extracted/assets ] && cp -r apk_extracted/assets module/

          [ -d apk_extracted/kotlin ] && cp -r apk_extracted/kotlin module/root/
          [ -d apk_extracted/META-INF/services ] && \
            mkdir -p module/root/META-INF && \
            cp -r apk_extracted/META-INF/services module/root/META-INF/

          echo "=== ধাপ ৪: module ZIP তৈরি করা ==="
          cd module && zip -r ../module.zip . && cd ..

          echo "=== ধাপ ৫: unsigned AAB তৈরি করা ==="
          java -jar bundletool.jar build-bundle \
            --modules=module.zip \
            --output=unsigned.aab

          echo "=== ধাপ ৬: AAB সাইন করা ==="
          jarsigner \
            -keystore $KEYSTORE_PATH \
            -storepass ${{ github.event.inputs.keystore_password }} \
            -keypass ${{ github.event.inputs.key_password }} \
            -signedjar signed-release.aab \
            unsigned.aab \
            ${{ github.event.inputs.key_alias }}

          echo "✅ Done! signed-release.aab তৈরি হয়েছে।"

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab-file
          path: signed-release.aab
